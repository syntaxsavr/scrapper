{% extends "base.html" %}
{% block content %}
<div class="navbar">
    <div class="nav-left">
        <h2><a href="{% url 'home' %}">Web Scraper</a></h2>
    </div>
    <div class="nav-right">
        <span class="welcome-text">Welcome, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="btn logout-btn">Logout</button>
        </form>
    </div>
</div>
<div class="detailed_view_container">
    <h2>{{ dataset.title }}</h2>
    {% if dataset.description != "no description" %}
    <p>Description:</p>
    <p>{{ dataset.description }}</p>
    {% endif %}
</div>
{% endblock %}
