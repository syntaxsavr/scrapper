name: Django CI/CD Docker

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install cosmic-ray
        pip install coverage

    # 4. Run tests
    - name: Run Tests
      run: |
        coverage run manage.py test --keepdb
        coverage report -m      

    # 5. Run mutation tests
    - name: Mutation Tests
      run: |
        cosmic-ray init cosmic-ray.toml cosmic-ray.sqlite
        cosmic-ray --verbosity=INFO baseline cosmic-ray.toml
        cosmic-ray exec cosmic-ray.toml cosmic-ray.sqlite
        cr-html cosmic-ray.sqlite > report.html

    # 6. Log in to Docker Hub using token
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}   # docker ID
        password: ${{ secrets.DOCKER_TOKEN }}      # access token

    # 7. Build and push Docker image
    - name: Build and push Docker image
      run: |
        IMAGE_NAME=s1ziegler/crapper
        if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
          TAG=latest
        else
          TAG=dev
        fi
        echo "Building $IMAGE_NAME:$TAG"
        docker build -t $IMAGE_NAME:$TAG .
        docker push $IMAGE_NAME:$TAG

    # 8. Upload coverage reports to Codecov
    - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}