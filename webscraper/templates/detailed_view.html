{% extends "base.html" %}
{% block content %}
<div class="detailed_view_container">
    <div class="mb-4">
        <h2>{{ dataset.title }}</h2>
        <p class="text-muted">
            <i class="fas fa-calendar"></i> Added {{ dataset.created_at|timesince }} ago
        </p>
    </div>

    {% if dataset.description %}
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title"><i class="fas fa-info-circle"></i> Description</h5>
            <p class="card-text">{{ dataset.description|truncatewords:100 }}</p>
        </div>
    </div>
    {% else %}
    <div class="alert alert-info">
        <i class="fas fa-info-circle"></i> No description available for this dataset.
    </div>
    {% endif %}

    <div class="mt-4">
        <a href="{% url 'home' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Search
        </a>
    </div>
</div>

<style>
.detailed_view_container {
    max-width: 800px;
    margin: 2rem auto;
    padding: 0 1rem;
}
</style>
{% endblock %}
